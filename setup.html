<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CareDent - Configuración Inicial</title>
  <style>
    body { font-family: 'Inter', sans-serif; background: #f3f4f6; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
    h2 { color: #1f2937; margin-top: 0; }
    p { color: #4b5563; font-size: 14px; margin-bottom: 20px; }
    button { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    button:hover { background: #059669; }
    .path-display { margin-top: 15px; font-size: 12px; color: #6b7280; word-break: break-all; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Configuración de CareDent</h2>
    <p>Selecciona en qué carpeta deseas guardar la base de datos de pacientes y sus radiografías. Puedes elegir Documentos, un Disco Externo, etc.</p>
    <button id="btn-select">Elegir Carpeta</button>
    <div id="path-display" class="path-display"></div>
  </div>
  <script>
    document.getElementById('btn-select').addEventListener('click', async () => {
      const path = await window.electronAPI.selectFolder();
      if (path) {
        document.getElementById('path-display').textContent = 'Guardado en: ' + path;
        setTimeout(() => { window.electronAPI.finishSetup(path); }, 1000);
      }
    });
  </script>
</body>
</html>
